name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: auditguard-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rodricastanio/AuditGuard@v0.1.0-alpha.10
        with:
          report-lang: 'es'